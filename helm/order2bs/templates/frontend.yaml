# ── ConfigMap: nginx.conf cho frontend ───────────────────────────────────────
# Ghi đè nginx.conf baked trong image để:
#   1. Thêm resolver Kubernetes DNS → nginx không crash khi backend chưa lên
#   2. Dùng biến ($upstream) thay vì hostname trực tiếp → DNS resolve per-request
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-nginx
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── Kubernetes DNS resolver ────────────────────────────────────────
        # REQUIRED: dùng biến cho proxy_pass để nginx không resolve hostname
        # tại startup time. Nếu backend chưa lên, nginx vẫn start thành công.
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

        # ── SPA React Router ──────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Proxy API → backend service (resolve per-request) ─────────────
        location /api/ {
            set $api_backend http://backend-svc.{{ .Release.Namespace }}.svc.cluster.local:8080;
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── WebSocket ──────────────────────────────────────────────────────
        location /ws {
            set $ws_backend http://backend-svc.{{ .Release.Namespace }}.svc.cluster.local:8080;
            proxy_pass $ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Uploads ───────────────────────────────────────────────────────
        location /uploads/ {
            set $upload_backend http://backend-svc.{{ .Release.Namespace }}.svc.cluster.local:8080;
            proxy_pass $upload_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── Gzip ──────────────────────────────────────────────────────────
        gzip on;
        gzip_types text/plain text/css application/json application/javascript
                   text/xml application/xml image/svg+xml;
    }
---
# ── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: frontend
          image: "{{ .Values.frontend.repository }}:{{ .Values.frontend.frontendTag }}"
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
          # ── Ghi đè nginx.conf từ ConfigMap ──────────────────────────────
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-frontend-nginx
---
# ── Service ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
spec:
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - port: 80
      targetPort: 80
