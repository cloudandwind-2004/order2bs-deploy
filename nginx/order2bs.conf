# ==============================================================================
# Nginx Reverse Proxy Config
# Domain  : order2bs.2bsystem.com.vn
# Backend : 192.168.100.170:30808 (NodePort)
# Frontend: Kubernetes Ingress tại 192.168.100.170:80
# ==============================================================================

upstream k8s_ingress {
    server 192.168.100.170:80;
    keepalive 64;
}

server {
    listen 80;
    server_name order2bs.2bsystem.com.vn;

    # Chuyển hướng tất cả HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name order2bs.2bsystem.com.vn;

    # ── SSL (thay bằng cert thực hoặc Let's Encrypt) ─────────────────────────
    # ssl_certificate     /etc/nginx/ssl/order2bs.crt;
    # ssl_certificate_key /etc/nginx/ssl/order2bs.key;

    # ── Nếu chỉ chạy HTTP nội bộ, comment block SSL trên và dùng listen 80 ──
    # Tạm thời dùng HTTP port 80, bỏ 2 dòng listen/server_name ở server block này
    # và comment return 301 ở server block trên

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Upload limit ─────────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    proxy_connect_timeout   60s;
    proxy_send_timeout      600s;
    proxy_read_timeout      600s;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── WebSocket support ─────────────────────────────────────────────────────
    location /ws {
        proxy_pass http://k8s_ingress;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API + Uploads ─────────────────────────────────────────────────────────
    location ~ ^/(api|uploads) {
        proxy_pass http://k8s_ingress;
    }

    # ── Frontend (SPA) ────────────────────────────────────────────────────────
    location / {
        proxy_pass http://k8s_ingress;
    }
}
